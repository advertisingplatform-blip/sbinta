<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creațiile Dariei</title>
<style>
  :root {
    --bg: #fff7ec;
    --card: #ffffff;
    --ink: #2b2a4c;
    --muted: #7a7894;
    --accent: #ff6b6b;
    --accent2: #ffb84d;
    --shadow: 0 6px 18px rgba(43, 42, 76, .12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    text-align: center;
    padding: 40px 16px 8px;
  }
  header h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: .5px;
  }
  header h1 span { color: var(--accent); }
  header p { margin: 8px 0 0; color: var(--muted); font-size: 1.1rem; }

  .grid {
    max-width: 1100px;
    margin: 28px auto 60px;
    padding: 0 16px;
    display: grid;
    gap: 22px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    display: block;
    background: var(--card);
    border-radius: 18px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-5px) rotate(-.6deg);
    box-shadow: 0 12px 26px rgba(43, 42, 76, .2);
    outline: none;
  }
  .thumb {
    position: relative;
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, #ffe3b3, #ffc2c2);
    overflow: hidden;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 50%;
    transform-origin: center 50%;
    display: block;
    opacity: 0;
    transition: opacity .4s ease;
  }
  .thumb img.ok { opacity: 1; }
  .thumb .fallback {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 3.4rem;
  }
  .thumb .fallback small {
    display: block; font-size: .8rem; color: var(--muted); text-align: center; margin-top: 4px;
  }
  .meta { padding: 12px 16px 16px; }
  .meta h2 { margin: 0; font-size: 1.1rem; }
  .meta span { font-size: .85rem; color: var(--muted); }
  footer { text-align: center; color: var(--muted); padding-bottom: 30px; font-size: .9rem; }
</style>
</head>
<body>

<header>
  <h1>Creațiile <span>Dariei</span> ✨</h1>
  <p>Desene animate și povești făcute cu multă imaginație</p>
</header>

<main class="grid" id="grid"></main>

<footer>Fă click pe o pictogramă ca să vezi creația.</footer>

<script>
/* ============================================================
   AICI ADAUGI CREAȚIILE NOI
   ------------------------------------------------------------
   Fiecare element are:
     url   - adresa paginii (obligatoriu)
     title - titlul afișat (opțional; dacă lipsește, se citește
             automat din <title> al paginii, pentru pagini de pe sbinta.com)
     emoji - pictogramă de rezervă dacă nu merge screenshot-ul (opțional)
     image - adresa unei imagini proprii, dacă vrei să înlocuiești
             screenshot-ul automat (opțional)
     poz   - poziția verticală a miniaturii, 0-100 (opțional)
     zoom  - mărirea miniaturii, ex. 1.5 (opțional)
   ============================================================ */
const CREATII = [
  { url: "https://sbinta.com/daria/",       emoji: "🐱" },
  { url: "https://sbinta.com/daria/2.html", emoji: "🐶" },
  // { url: "https://sbinta.com/daria/3.html", title: "Titlul nou", emoji: "🌈" },
];

/* ---------- Setări screenshot ---------- */
const LATIME = 640;       // lățimea miniaturii în pixeli
const ASTEPT_SEC = 4;     // câte secunde așteaptă serviciul înainte de captură
                          // (util pentru animații, ca să nu fie pagina goală)
const POZ_Y = 50;         // poziția verticală a imaginii în card, 0-100
                          // (0 = se vede partea de sus, 100 = partea de jos;
                          //  mărește valoarea ca să "ridici" desenul în card)
const ZOOM = 1.3;         // mărire ca să dispară marginile goale (1 = fără zoom)
                          // Pe fiecare creație poți pune și { poz: 65, zoom: 1.5 }

/* Serviciul principal: thum.io (gratuit, fără cheie).
   Rezervă: WordPress mshots. */
function screenshotUrl(url) {
  return "https://image.thum.io/get/width/" + LATIME +
         "/wait/" + ASTEPT_SEC + "/noanimate/" + url;
}
function screenshotRezerva(url) {
  return "https://s0.wp.com/mshots/v1/" + encodeURIComponent(url) +
         "?w=" + LATIME + "&h=" + Math.round(LATIME * 0.75);
}

/* ---------- Cod (nu trebuie modificat) ---------- */
const grid = document.getElementById("grid");

function numeDinUrl(url) {
  try {
    const u = new URL(url);
    const f = u.pathname.split("/").filter(Boolean).pop() || u.hostname;
    return decodeURIComponent(f.replace(/\.html?$/i, ""));
  } catch (e) { return url; }
}

function hostDinUrl(url) {
  try { return new URL(url).hostname; } catch (e) { return ""; }
}

/* Citește <title> doar pentru pagini de pe același domeniu
   (pentru alte domenii browserul blochează cererea). */
async function titluAutomat(url) {
  try {
    const u = new URL(url, location.href);
    if (u.origin !== location.origin) return null;
    const r = await fetch(u.href);
    if (!r.ok) return null;
    const html = await r.text();
    const m = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    if (!m) return null;
    const t = document.createElement("textarea");
    t.innerHTML = m[1];           // decodează entitățile HTML
    return t.value.trim() || null;
  } catch (e) { return null; }
}

function creeazaCard(item) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = item.url;

  const thumb = document.createElement("div");
  thumb.className = "thumb";

  const fb = document.createElement("div");
  fb.className = "fallback";
  fb.innerHTML = "<div>" + (item.emoji || "🎨") + "</div>";
  thumb.appendChild(fb);

  const img = document.createElement("img");
  img.alt = "";
  img.loading = "lazy";
  const poz = item.poz != null ? item.poz : POZ_Y;
  const zoom = item.zoom != null ? item.zoom : ZOOM;
  img.style.objectPosition = "center " + poz + "%";
  img.style.transformOrigin = "center " + poz + "%";
  img.style.transform = "scale(" + zoom + ")";
  let pas = 0;
  const surse = item.image
    ? [item.image, screenshotUrl(item.url), screenshotRezerva(item.url)]
    : [screenshotUrl(item.url), screenshotRezerva(item.url)];
  img.onload = () => {
    // ignoră imaginile minuscule (de obicei sunt erori)
    if (img.naturalWidth > 50) { img.classList.add("ok"); fb.style.display = "none"; }
  };
  img.onerror = () => {
    pas++;
    if (pas < surse.length) img.src = surse[pas];
  };
  img.src = surse[0];
  thumb.appendChild(img);

  const meta = document.createElement("div");
  meta.className = "meta";
  const h = document.createElement("h2");
  h.textContent = item.title || numeDinUrl(item.url);
  const s = document.createElement("span");
  s.textContent = hostDinUrl(item.url);
  meta.appendChild(h);
  meta.appendChild(s);

  a.appendChild(thumb);
  a.appendChild(meta);

  if (!item.title) {
    titluAutomat(item.url).then(t => { if (t) h.textContent = t; });
  }
  return a;
}

CREATII.forEach(item => grid.appendChild(creeazaCard(item)));
</script>
</body>
</html>
